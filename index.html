<!DOCTYPE html>
<html lang="pl">
<head>

  <title>Karta Gracza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player-card">

        <li>Wygrane mecze: <strong>150</strong></li>
        <li>Przegrane mecze: <strong>50</strong></li>

    <section class="card-section achievements">
      <h2>🏆 Osiągnięcia 🏆</h2>
      <ul>
        <li>Najlepszy gracz miesiąca: <strong>3 razy</strong></li>
        <li>Zdobywca rangi mistrza: <strong>1 raz</strong></li>
        <li>Ukończone wyzwania: <strong>50+</strong></li>
      </ul>
